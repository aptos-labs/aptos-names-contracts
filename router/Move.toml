[package]
name = 'router'
version = '1.0.0'

[addresses]
aptos_names = "_"
aptos_names_v2_1 = "_"
aptos_names_admin = "_"
aptos_names_funds = "_"
router_signer = "_"
router = "_"

[dev-addresses]
aptos_names = "0x1FF"
aptos_names_v2_1 = "0x2FF"
aptos_names_admin = "0x3FF"
aptos_names_funds = "0x4FF"
router_signer = "0x5FF"
router = "0x6FF"


[dependencies.aptos_names]
local = "../core"

[dependencies.aptos_names_v2_1]
local = "../core_v2"

[dependencies.AptosFramework]
git = 'https://github.com/aptos-labs/aptos-framework.git'
rev = 'mainnet'
subdir = 'aptos-framework'

[dependencies.AptosToken]
git = 'https://github.com/aptos-labs/aptos-framework.git'
rev = 'mainnet'
subdir = 'aptos-token'

[dependencies.AptosTokenObjects]
git = 'https://github.com/aptos-labs/aptos-framework.git'
rev = 'mainnet'
subdir = 'aptos-token-objects'
